<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NikoStory2</title>
<style>
  body { margin: 0; background: #14121a; color: #e8e6f0; font: 15px/1.5 system-ui, sans-serif;
         display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
  canvas { background: #1d1a26; border-radius: 8px; flex: none; }
  #panel { flex: 1; min-width: 300px; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
  #hud { color: #b9b3d1; font-size: 13px; }
  #log { height: 340px; overflow: auto; background: #1d1a26; border-radius: 8px; padding: 12px; }
  #log p { margin: 0 0 10px; }
  .t { color: #8a84a3; font-size: 12px; }
  #options { display: flex; flex-direction: column; gap: 6px; }
  button { background: #2c2740; color: #e8e6f0; border: 1px solid #3f385c; border-radius: 6px;
           padding: 8px 12px; text-align: left; font: inherit; cursor: pointer; }
  button:hover { background: #38315a; }
  #err { color: #ff8fa3; min-height: 1.4em; }
  #help { color: #8a84a3; font-size: 12px; }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="panel">
  <div id="hud"></div>
  <div id="log"></div>
  <div id="err"></div>
  <div id="options"></div>
  <div id="help">Move: arrows or WASD · Wait: space · Options: keys 1-3</div>
</div>
<script>
const C = 36;
const cv = document.getElementById("map"), cx = cv.getContext("2d");
const $ = (id) => document.getElementById(id);
let S = null, busy = false;

async function load() { S = await (await fetch("/api/state")).json(); render(); }

async function act(action) {
  if (busy) return;
  busy = true;
  $("err").textContent = "";
  try {
    const r = await (await fetch("/api/turn", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(action),
    })).json();
    if (!r.ok) $("err").textContent = r.error || "Cannot do that.";
    if (r.state) { S = r.state; render(); }
  } finally { busy = false; }
}

function cell(x, y, color, inset = 0) {
  cx.fillStyle = color;
  cx.fillRect(x * C + inset, y * C + inset, C - inset * 2, C - inset * 2);
}
function token(x, y, color, letter) {
  cx.fillStyle = color;
  cx.beginPath(); cx.arc(x * C + C / 2, y * C + C / 2, C / 2 - 4, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = "#14121a"; cx.font = "bold 16px system-ui"; cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.fillText(letter, x * C + C / 2, y * C + C / 2 + 1);
}

function render() {
  const z = S.zone;
  cv.width = z.width * C; cv.height = z.height * C;
  for (let y = 0; y < z.height; y++) for (let x = 0; x < z.width; x++) {
    const c = z.map[y][x];
    cell(x, y, c === "#" ? "#3a3550" : c === "D" ? "#8a6d3b" : (x + y) % 2 ? "#262233" : "#2a2637");
  }
  for (const o of z.objects) {
    cell(o.x, o.y, "#5b4f7a", 4);
    cx.fillStyle = "#e8e6f0"; cx.font = "12px system-ui"; cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillText(o.name.replace(/^the /, "")[0].toUpperCase(), o.x * C + C / 2, o.y * C + C / 2);
  }
  for (const n of S.npcs) token(n.x, n.y, "#f0a45b", n.name[0]);
  token(S.niko.x, S.niko.y, "#c9b8ff", "N");

  $("hud").textContent = `${z.name} · turn ${S.tick} · Ether ${S.niko.ether}/${S.niko.ether_max}`;
  $("log").innerHTML = S.log.map((r) =>
    `<p><span class="t">turn ${r.tick}</span><br>${r.text.replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</p>`).join("");
  $("log").scrollTop = $("log").scrollHeight;
  $("options").innerHTML = "";
  S.options.forEach((o, i) => {
    const b = document.createElement("button");
    b.textContent = `${i + 1}. ${o.text}`;
    b.onclick = () => act(o.action);
    $("options").appendChild(b);
  });
}

const KEYS = { ArrowUp: "N", w: "N", ArrowDown: "S", s: "S", ArrowRight: "E", d: "E", ArrowLeft: "W", a: "W" };
addEventListener("keydown", (e) => {
  if (!S) return;
  if (KEYS[e.key]) { e.preventDefault(); act({ type: "move", dir: KEYS[e.key] }); }
  else if (e.key === " ") { e.preventDefault(); act({ type: "wait" }); }
  else if (/^[1-3]$/.test(e.key) && S.options[e.key - 1]) act(S.options[e.key - 1].action);
});

load();
</script>
</body>
</html>
